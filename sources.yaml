# tech-blog-watch 監看來源
#
# 每個來源欄位：
#   name          顯示名稱
#   mode          rss | scrape
#   url           RSS feed 網址（rss）或列表頁網址（scrape）
#   base          （scrape 專用）相對連結要補上的網域
#   link_pattern  （scrape 專用）文章連結的 regex，用來從列表頁挑出文章 URL
#
# 加新來源：RSS 有就用 rss（穩），沒有就用 scrape + link_pattern。

settings:
  max_age_days: 7      # 只處理近 N 天發佈的文章（抓不到日期的仍會處理，靠 state 去重）
  max_per_source: 6    # 每個來源單次最多處理幾篇（防洪水）
  max_per_run: 20      # 單次整體上限（保險絲）
  model: gemini-3.5-flash   # 免費 tier flash；想更省可換 gemini-2.5-flash / gemini-2.5-flash-lite
  article_char_limit: 12000   # 丟給 Gemini 的內文字元上限（控 token）
  skip_weekdays: [6]    # 台北時間星期幾整天不發（0=週一 → 6=週日）；當天不抓不標記，內容自然滾入下一天
  pulse_enabled: true   # 每日「AI 產業脈動」段落（Gemini Grounding with Google Search；每個啟用的段每天各花 1 次 grounded query）
  finance_pulse_enabled: false   # 2026-08-31 併入產業脈動段（industry-pulse.md 開了金融窄門）；獨立段 44 天實測噪音多、真料週均僅 2〜3 則
  pulse_model: gemini-2.5-flash   # 脈動用的模型；3.5-flash 的 grounded query 在免費 key 上會 429，2.5 系列另有每日免費額度
  github_weekly_enabled: true   # 每週「GitHub 專案」段（HN 高分 + GitHub Trending；非 grounded，用一般摘要模型）
  github_weekly_weekdays: [0, 2, 4]  # 台北時間星期幾出（可多天）；0=週一 → 一/三/五（週三接住週一二最旺的 HN 供給）
  github_weekly_top_n: 4        # 每次最多介紹幾個專案（上限不是目標；三天排程下 5 會稀釋品質，見 2026-08-31 供給實測）
  github_hn_min_points: 100     # HN 候選的最低分數門檻
  github_refeature_days: 14     # 介紹過的 repo 至少隔幾天、且有新 release 才會再出現
  github_shown_cooldown_days: 6 # 送給模型看過但沒被選上的候選，隔幾天內不再送（三天排程候選窗重疊 62%，防同批弱候選回鍋）
  youtube_weekly_enabled: true  # 每週「YouTube 精選」段（頻道白名單 RSS → Gemini 選題導讀；非 grounded，用一般摘要模型）
  youtube_weekly_weekdays: [3]  # 台北時間星期幾出；3=週四（錯開 GitHub 段的一/三/五）
  youtube_weekly_top_n: 3       # 每次最多介紹幾支（上限不是目標）
  youtube_max_age_days: 7       # 只考慮近 N 天發佈的影片

# YouTube 頻道白名單（每週 YouTube 精選段的候選來源）。
