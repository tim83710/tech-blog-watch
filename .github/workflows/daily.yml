name: daily-blog-watch

on:
  schedule:
    # 22:17 UTC = 台北 06:17（避開整點/半點的壅塞分鐘）。GitHub schedule 是 best-effort，
    # 2026 年實測平台級積壓常延遲 1〜4 小時、偶爾更久且換分鐘無解；若將來要砍延遲尾端，
    # 升級路徑是外部排程器打 workflow_dispatch（步驟見 README「排程與觸發」，目前未啟用）。
    # 同日重複觸發由 main.py 的 --once-per-day guard 擋掉，先跑成功的那個贏。
    - cron: "17 22 * * *"
  workflow_dispatch:        # GitHub 網頁手動觸發（測試用）；將來的外部排程器也走這裡
    inputs:
      force:
        description: "跳過 --once-per-day guard（同一天重跑測試用）"
        type: boolean
        default: false

# 讓 workflow 能把更新後的 state.json commit 回 repo
permissions:
  contents: write

concurrency:
  group: daily-blog-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25       # 任一步驟卡住就 25 分鐘收工，不再佔滿 6h 上限被強制取消
    steps:
      - uses: actions/checkout@v4
        with:
          # 必加：schedule 觸發的 run 其 GITHUB_SHA 釘在 run「建立當下」的 commit，
          # 若這個 run 在佇列裡等到前一個 run push 完 state.json 才開跑，預設 checkout
          # 會拿到舊 state → --once-per-day guard 讀不到 last_run_date 而重複發送。
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run tech-blog-watch
        env:
          PYTHONUNBUFFERED: "1"   # 不緩衝 stdout：萬一卡住，log 也能看到卡在哪一步
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}   # 選填：不設就用 sources.yaml 的預設
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          SLACK_USERNAME: ${{ secrets.SLACK_USERNAME }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # 平台開關：repo Settings → Secrets and variables → Actions → Variables
          # 設 SEND_SLACK / SEND_EMAIL 為 false 可關閉該平台；沒設＝都發
          SEND_SLACK: ${{ vars.SEND_SLACK }}
          SEND_EMAIL: ${{ vars.SEND_EMAIL }}
          # GitHub API 配額（每週 GitHub 專案段抓 README / release 用；自動提供、不用另設）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RERUN: ${{ inputs.force }}
        # 平常都帶 --once-per-day（dispatch 與 fallback cron 同日只發一次）；
        # 手動 dispatch 勾 force 才拿掉，讓同一天能重跑測試
        run: python main.py $([ "$FORCE_RERUN" = "true" ] || echo --once-per-day)

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "chore: update seen state [skip ci]"
            git push
          else
            echo "state.json unchanged"
          fi
